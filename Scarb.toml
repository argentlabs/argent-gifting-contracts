[package]
name = "argent_gifting"
version = "0.1.0"
edition = "2023_11"


[dependencies]
starknet = "2.6.3"
openzeppelin = "1.0.0"
alexandria_math = "0.5.0"

[[target.starknet-contract]]
sierra = true
casm = true


[dev-dependencies]
snforge_std = "0.57.0"
assert_macros = "2.10.1"

[tool.fmt]
max-line-length = 120
sort-module-level-items = true

[scripts]
test = "snforge test"
start-devnet = "pnpm exec tsc && pnpm exec tsx scripts/ensure-devnet.ts"
kill-devnet = "docker stop devnet"
test-ts = "scarb --profile release build && pnpm exec tsc && pnpm exec tsx scripts/ensure-devnet.ts && pnpm exec mocha --spec \"tests-integration/**/*.test.ts\""
profile = "scarb --profile release build && pnpm exec tsc && pnpm exec tsx scripts/ensure-devnet.ts && pnpm exec tsx scripts/profile.ts"
format = "scarb fmt && pnpm exec prettier --write ."
deploy = "scarb --profile release build && pnpm exec tsc && pnpm exec tsx scripts/deploy.ts"
